name: Download YouTube Video to GitHub Releases

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'קישור לסרטון יוטיוב'
        required: true
        type: string

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yt-dlp and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Download Video
        run: |
          yt-dlp --no-check-certificate -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" --merge-output-format mp4 -o "downloaded_video.mp4" "${{ github.event.inputs.youtube_url }}"

      - name: Create Release and Upload Video
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_id }}
          name: Downloaded Video ${{ github.run_number }}
          files: downloaded_video.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
