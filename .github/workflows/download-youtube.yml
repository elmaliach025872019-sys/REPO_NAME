name: Download YouTube Video to GitHub Releases

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'קישור לסרטון'
        required: true
        type: string

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download Video via Custom Script
        run: |
          python download.py "${{ github.event.inputs.youtube_url }}"

      - name: Create Release and Upload Video
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_id }}
          name: Downloaded Video ${{ github.run_number }}
          files: downloaded_video.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
