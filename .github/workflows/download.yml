name: Proxy Downloader

on:
  repository_dispatch:
    types: [proxy-download]

run-name: ${{ github.event.client_payload.request_id }}

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Write cookies file (from secret, never logged)
        if: github.event.client_payload.mode == 'video'
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s' "$YT_COOKIES" > cookies.txt

      - name: Install yt-dlp
        if: github.event.client_payload.mode == 'video'
        run: pip install -U yt-dlp

      - name: Download video
        if: github.event.client_payload.mode == 'video'
        run: |
          set -e
          mkdir -p output
          URL="${{ github.event.client_payload.url }}"
          QUALITY="${{ github.event.client_payload.quality }}"
          case "$QUALITY" in
            mp3)
              yt-dlp --cookies cookies.txt -x --audio-format mp3 \
                -o "output/%(title)s.%(ext)s" "$URL"
              ;;
            1080)
              yt-dlp --cookies cookies.txt -f "bv*[height<=1080]+ba/b[height<=1080]" \
                -o "output/%(title)s.%(ext)s" "$URL"
              ;;
            720)
              yt-dlp --cookies cookies.txt -f "bv*[height<=720]+ba/b[height<=720]" \
                -o "output/%(title)s.%(ext)s" "$URL"
              ;;
            480)
              yt-dlp --cookies cookies.txt -f "bv*[height<=480]+ba/b[height<=480]" \
                -o "output/%(title)s.%(ext)s" "$URL"
              ;;
            *)
              yt-dlp --cookies cookies.txt -f "bv*+ba/b" \
                -o "output/%(title)s.%(ext)s" "$URL"
              ;;
          esac

      - name: Download generic file
        if: github.event.client_payload.mode == 'file'
        run: |
          set -e
          mkdir -p output
          URL="${{ github.event.client_payload.url }}"
          curl -L --fail -o "output/$(basename "$URL")" "$URL"

      - name: Remove cookies file
        if: always()
        run: rm -f cookies.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: download-${{ github.event.client_payload.request_id }}
          path: output/
          retention-days: 1
          if-no-files-found: error
