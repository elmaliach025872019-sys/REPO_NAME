name: Proxy Downloader

on:
  repository_dispatch:
    types: [proxy-download]

run-name: ${{ github.event.client_payload.request_id }}

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install yt-dlp
        if: github.event.client_payload.mode == 'video'
        run: |
          python -m pip install --upgrade pip
          pip install -U yt-dlp

      - name: Write cookies file
        if: github.event.client_payload.mode == 'video'
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > cookies.txt
          fi

      - name: Download Video
        if: github.event.client_payload.mode == 'video'
        run: |
          mkdir -p output
          URL="${{ github.event.client_payload.url }}"
          
          if [ -f cookies.txt ]; then
            yt-dlp --cookies cookies.txt -f "best[ext=mp4]/best" -o "output/video.mp4" "$URL"
          else
            yt-dlp -f "best[ext=mp4]/best" -o "output/video.mp4" "$URL"
          fi

      - name: Upload Video Artifact
        if: github.event.client_payload.mode == 'video'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.client_payload.request_id }}
          path: output/video.mp4
