# .github/workflows/proxy.yml
name: Proxy Downloader
run-name: dl-${{ github.event.client_payload.request_id }}

on:
  repository_dispatch:
    types: [download]

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deno Runtime
        if: github.event.client_payload.mode == 'video'
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install Dependencies & yt-dlp Plugin
        if: github.event.client_payload.mode == 'video'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg curl
          python -m pip install --upgrade pip
          pip install -U "yt-dlp[default]" bgutil-ytdlp-pot-provider

      - name: Start PO Token Provider
        if: github.event.client_payload.mode == 'video'
        run: |
          docker run -d --name pot-provider -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          echo "Waiting for PO Token provider service..."
          for i in {1..15}; do
            if curl -sf http://127.0.0.1:4416/ping; then
              echo "PO Token provider is ready!"
              break
            fi
            echo "Attempt $i failed, retrying in 2 seconds..."
            sleep 2
          done

      - name: Write cookies file
        if: github.event.client_payload.mode == 'video'
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > cookies.txt
            echo "Cookies file created."
          fi

      - name: Download Video Content
        if: github.event.client_payload.mode == 'video'
        run: |
          mkdir -p out
          URL="${{ github.event.client_payload.url }}"
          QUALITY="${{ github.event.client_payload.quality }}"
          
          ARGS=(
            --extractor-args "youtube:player_client=web,android;player_skip=configs"
            --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"
            --js-runtimes deno
            --remote-components ejs:github
            -o "out/%(title).80s.%(ext)s"
          )

          if [ -f cookies.txt ]; then
            ARGS+=(--cookies cookies.txt)
          fi

          if [ "$QUALITY" = "mp3" ]; then
            ARGS+=(-x --audio-format mp3)
          elif [ "$QUALITY" = "1080" ]; then
            ARGS+=(-f "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080]" --merge-output-format mp4)
          elif [ "$QUALITY" = "720" ]; then
            ARGS+=(-f "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720]" --merge-output-format mp4)
          elif [ "$QUALITY" = "480" ]; then
            ARGS+=(-f "bestvideo[height<=480][ext=mp4]+bestaudio[ext=m4a]/best[height<=480]" --merge-output-format mp4)
          else
            ARGS+=(-f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" --merge-output-format mp4)
          fi

          yt-dlp "${ARGS[@]}" "$URL"

      - name: Download Direct File
        if: github.event.client_payload.mode == 'file'
        run: |
          mkdir -p out
          URL="${{ github.event.client_payload.url }}"
          
          CLEAN_URL="${URL%%\?*}"
          FILENAME=$(basename "$CLEAN_URL")
          if [ -z "$FILENAME" ]; then
            FILENAME="downloaded_file"
          fi
          
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -o "out/$FILENAME" "$URL"

      - name: Upload Artifact
        run: |
          REAL_FILE=$(ls -1 out/ | head -n 1)
          if [ -z "$REAL_FILE" ]; then
            echo "Error: No file downloaded!"
            exit 1
          fi
          
      - uses: actions/upload-artifact@v4
        with:
          name: download-result
          path: out/
