name: Proxy Downloader

on:
  repository_dispatch:
    types: [download]
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to download'
        required: true
        type: string
      mode:
        description: 'Download mode (video or file)'
        required: true
        default: 'video'
        type: choice
        options:
          - video
          - file

jobs:
  download:
    runs-on: ubuntu-latest

    services:
      pot-provider:
        image: brainicism/bgutil-ytdlp-pot-provider:latest
        ports:
          - 8080:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl wget

      - name: Install yt-dlp & PO Token Plugin
        run: |
          python -m pip install --upgrade pip
          pip install -U "yt-dlp[default]" bgutil-ytdlp-pot-provider

      - name: Create output directory
        run: mkdir -p out

      - name: Extract Variables & Handle Cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          PAYLOAD_URL: ${{ github.event.client_payload.url }}
          PAYLOAD_MODE: ${{ github.event.client_payload.mode }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          # חילוץ הקישור
          URL="${PAYLOAD_URL:-$INPUT_URL}"
          echo "DOWNLOAD_URL=$URL" >> $GITHUB_ENV

          # חילוץ מצב ההורדה (video / file)
          MODE="${PAYLOAD_MODE:-$INPUT_MODE}"
          if [ -z "$MODE" ]; then MODE="video"; fi
          echo "DOWNLOAD_MODE=$MODE" >> $GITHUB_ENV

          # טיפול בעוגיות אם קיימות
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
            echo "COOKIES_FLAG=--cookies cookies.txt" >> $GITHUB_ENV
            echo "Cookies found and configured."
          else
            echo "COOKIES_FLAG=" >> $GITHUB_ENV
            echo "No cookies found in secrets."
          fi

      - name: Download Video
        if: env.DOWNLOAD_MODE == 'video'
        run: |
          yt-dlp $COOKIES_FLAG \
            --extractor-args "youtube:player-client=android,web" \
            -o "out/%(title)s.%(ext)s" \
            "${{ env.DOWNLOAD_URL }}"

      - name: Download File
        if: env.DOWNLOAD_MODE == 'file'
        run: |
          cd out
          curl -L -O -J "${{ env.DOWNLOAD_URL }}"

      - name: Upload Downloaded File
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: out/
          retention-days: 1
